# ---------------------------------------------------------------------------
# Secrets referenced by the orchestrator stack.
#
# Secrets are NEVER hardcoded in the manifests — they are injected as env vars
# / secretKeyRefs. Create them with:
#
#   kubectl create secret generic orchestrator-secrets \
#     --namespace orchestrator \
#     --from-literal=openai-api-key=<the-openai-key>
#
#   kubectl create secret generic idrac-credentials \
#     --namespace monitoring \
#     --from-literal=password=<the-idrac-password>
#
# Rotate the values above whenever the underlying secret changes.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: orchestrator-secrets
  namespace: orchestrator
  labels:
    app: orchestrator
type: Opaque
stringData:
  openai-api-key: ""

---
apiVersion: v1
kind: Secret
metadata:
  name: idrac-credentials
  namespace: monitoring
  labels:
    app: idrac-telemetry
type: Opaque
stringData:
  password: ""
