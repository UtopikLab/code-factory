# NOTE: SUPERSEDED — this workflow is superseded by `drain.yaml` (the canonical
# in-cluster autonomous drain-loop design). DO NOT USE. This file matches the
# older design (RUNNER_TOKEN secret, free-for-all `runs-on: ubuntu-latest`, no
# `done` kill-switch) and would double-trigger tasks alongside `drain.yaml`;
# it is retained only for reference.
name: Send to Orchestrator

on:
  issues:
    types: [opened, labeled]

jobs:
  send-to-orchestrator:
    runs-on: ubuntu-latest

    steps:
      - name: Extract task info
        id: task-info
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            TASK_ID="${{ github.event.issue.number }}"
            ISSUE_TITLE="${{ github.event.issue.title }}"
            ISSUE_URL="${{ github.event.issue.html_url }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            TASK_ID="${{ github.event.pull_request.number }}"
            ISSUE_TITLE="${{ github.event.pull_request.title }}"
            ISSUE_URL="${{ github.event.pull_request.html_url }}"
          elif [ -n "${{ inputs.issue_number }}" ]; then
            TASK_ID="${{ inputs.issue_number }}"
            ISSUE_TITLE="Manual dispatch task"
            ISSUE_URL="https://github.com/${{ github.repository }}/issues/${{ inputs.issue_number }}"
          else
            echo "No task info available"
            exit 1
          fi

          echo "task_id=$TASK_ID" >> $GITHUB_OUTPUT
          echo "issue_title=$ISSUE_TITLE" >> $GITHUB_OUTPUT
          echo "issue_url=$ISSUE_URL" >> $GITHUB_OUTPUT

      - name: Send task to orchestrator
        # Post the task to the always-on supervisor's in-cluster Service
        # (orchestrator.orchestrator.svc:8000). Auth uses the built-in
        # $GITHUB_TOKEN (scoped by this workflow's permissions) — no RUNNER_TOKEN.
        run: |
          set -euo pipefail
          REF="${{ github.ref }}"
          REPO="${{ github.repository }}"
          ISSUE_NUM="${{ github.event.issue.number }}"
          ISSUE_TITLE="${{ github.event.issue.title }}"
          ISSUE_URL="${{ github.event.issue.html_url }}"
          SUPERVISOR_URL="${SUPERVISOR_URL:-https://supervisor.orchestrator.svc.cluster.local:8000}"
          RESPONSE=$(curl -fsS -X POST "${SUPERVISOR_URL}/api/v1/tasks/spawn" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"orchestrator-agent\",\"ref\":\"${REF}\",\"payload\":{\"issue_number\":${ISSUE_NUM},\"issue_title\":\"${ISSUE_TITLE}\",\"issue_url\":\"${ISSUE_URL}\",\"repo\":\"${REPO}\",\"default_branch\":\"${{ github.event.repository.default_branch }}\"}}")
          echo "Spawn response: $RESPONSE"
