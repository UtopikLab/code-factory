# Build and push the LangGraph orchestrator runtime image to GHCR.
#
# Produces:
#   ghcr.io/UtopikLab/langgraph-orchestrator:latest
#   ghcr.io/UtopikLab/langgraph-orchestrator:<git-short-sha>
#
# This image is consumed by the k8s manifests under orchestrator/ (the
# ${IMAGE:-ghcr.io/UtopikLab/langgraph-orchestrator:latest} placeholder).
name: build-push-orchestrator-image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push the image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: ./orchestrator
          push: true
          tags: |
            ghcr.io/UtopikLab/langgraph-orchestrator:latest
            ghcr.io/UtopikLab/langgraph-orchestrator:${{ github.sha }}
            ghcr.io/UtopikLab/langgraph-orchestrator:${{ github.ref_name }}

      - name: Image digest
        run: echo "docker_build.digest=${{ steps.docker_build.outputs.digest }}" >> "$GITHUB_OUTPUT"
