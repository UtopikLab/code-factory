name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  SUPERVISOR_IMAGE_NAME: utopiklab/code-factory-supervisor
  WORKER_IMAGE_NAME: utopiklab/code-factory-worker
  GATEWAY_IMAGE_NAME: utopiklab/code-factory-gateway

jobs:
  set-image-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Set image tag
        id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run linting
        run: ruff check orchestrator/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the full union of runtime dependencies declared in each
          # sub-package requirements file (supervisor/worker/gateway).
          # This guarantees prometheus_client, pydantic, langchain-core,
          # langchain-sdk, tenacity, fastapi, uvicorn, httpx, openai, etc.
          pip install -r orchestrator/supervisor/requirements.txt \
            -r orchestrator/worker/requirements.txt \
            -r orchestrator/gateway/requirements.txt
          # pytest is not part of any requirements file, so install it
          # separately to guarantee the `pytest` binary is on PATH.
          pip install pytest

      - name: Run tests
        run: pytest orchestrator/ -v

  build-supervisor:
    needs: [lint, test, set-image-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./orchestrator/supervisor
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.SUPERVISOR_IMAGE_NAME }}:${{ needs.set-image-tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.SUPERVISOR_IMAGE_NAME }}:latest

  build-worker:
    needs: [lint, test, set-image-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./orchestrator/worker
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.WORKER_IMAGE_NAME }}:${{ needs.set-image-tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.WORKER_IMAGE_NAME }}:latest

  build-gateway:
    needs: [lint, test, set-image-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./orchestrator/gateway
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.GATEWAY_IMAGE_NAME }}:${{ needs.set-image-tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.GATEWAY_IMAGE_NAME }}:latest
