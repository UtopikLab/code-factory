name: Autonomous drain loop

on:
  issues:
    types: [opened, reopened, assigned]
  workflow_dispatch:
    inputs:
      retry_task_id:
        description: Failed task ID to retry after resolving its failure
        required: true
        type: string

permissions:
  id-token: write
  contents: read
  issues: read

concurrency:
  group: drain-${{ github.repository }}-${{ github.event.issue.number || inputs.retry_task_id }}
  cancel-in-progress: false

jobs:
  send-to-orchestrator:
    if: ${{ github.event.issue.pull_request == null }}
    runs-on: ubuntu-latest
    steps:
      - name: Check issue state
        if: github.event_name == 'issues'
        id: issue-state
        uses: actions/github-script@v9
        with:
          script: |
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            core.setOutput("skip", labels.some(label => label.name === "done") ? "true" : "false");

      - name: POST task to orchestrator
        if: steps.issue-state.outputs.skip != 'true'
        env:
          CODEFACTORY_URL: https://code-factory.utopiklab.com
          CODEFACTORY_OIDC_AUDIENCE: https://code-factory.utopiklab.com/tasks
          RETRY_TASK_ID: ${{ inputs.retry_task_id }}
        shell: python
        run: |
          import json
          import os
          import re
          import urllib.error
          import urllib.request
          from urllib.parse import parse_qsl, urlencode, urlsplit

          url = os.environ["CODEFACTORY_URL"]
          parsed = urlsplit(url)
          if (parsed.scheme != "https" or not parsed.hostname or parsed.username or parsed.password
                  or parsed.query or parsed.fragment or parsed.path not in ("", "/")
                  or "\\" in url or any(ord(character) <= 32 for character in url)):
              raise SystemExit("CODEFACTORY_URL must be an HTTPS base URL without a path, query or fragment")
          url = parsed._replace(path="/api/v1/tasks/spawn").geturl()
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event_file:
              event = json.load(event_file)
          repo = os.environ["GITHUB_REPOSITORY"]
          if event["repository"]["full_name"].lower() != repo.lower():
              raise SystemExit("Repository identity mismatch")
          if os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch":
              retry_task_id = os.environ.get("RETRY_TASK_ID", "")
              retry_key = os.environ["GITHUB_RUN_ID"]
              if not re.fullmatch(r"issue-[a-f0-9]{32}", retry_task_id) or not re.fullmatch(r"[0-9]+", retry_key):
                  raise SystemExit("A valid failed task ID and workflow run ID are required")
              url = parsed._replace(path="/api/v1/tasks/" + retry_task_id + "/retry").geturl()
              payload = {"retry_key": retry_key}
          else:
              payload = {"repo": repo, "issue_number": event["issue"]["number"]}

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise ValueError("Intake redirect rejected")

          headers = {"Content-Type": "application/json"}
          audience = os.environ.get("CODEFACTORY_OIDC_AUDIENCE", "")
          if not audience:
              raise SystemExit("GitHub Actions identity unavailable: CODEFACTORY_OIDC_AUDIENCE is not configured")
          runner_url = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_URL", "")
          runner_token = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_TOKEN", "")
          if not runner_url or not runner_token:
              raise SystemExit("GitHub Actions identity unavailable: runner OIDC environment missing; require id-token: write")
          identity_error = "runner OIDC endpoint rejected"
          try:
              identity_url = urlsplit(runner_url)
              if (identity_url.scheme != "https"
                  or not identity_url.hostname or not identity_url.hostname.endswith(".actions.githubusercontent.com")
                  or identity_url.username or identity_url.password or identity_url.fragment
                  or identity_url.port not in (None, 443)):
                raise ValueError()
              query = [(key, value) for key, value in parse_qsl(identity_url.query) if key != "audience"]
              identity_url = identity_url._replace(query=urlencode(query + [("audience", audience)])).geturl()
              identity_error = "token request rejected"
              identity_request = urllib.request.Request(identity_url, headers={"Authorization": "Bearer " + runner_token})
              with urllib.request.build_opener(NoRedirect()).open(identity_request, timeout=15) as response:
                identity_error = "invalid token response"
                raw = response.read(32769)
                if response.status != 200 or len(raw) > 32768:
                      raise ValueError()
                identity_token = json.loads(raw)["value"]
              if not isinstance(identity_token, str) or not identity_token or len(identity_token) > 16384 or any(character.isspace() for character in identity_token):
                raise ValueError()
              headers["Authorization"] = "Bearer " + identity_token
          except urllib.error.HTTPError as error:
              raise SystemExit("GitHub Actions identity unavailable: token request failed: HTTP " + str(error.code)) from None
          except OSError:
              raise SystemExit("GitHub Actions identity unavailable: token endpoint unreachable") from None
          except (KeyError, ValueError, TypeError, AttributeError):
              raise SystemExit("GitHub Actions identity unavailable: " + identity_error) from None
          request = urllib.request.Request(url, method="POST", data=json.dumps(payload).encode(), headers=headers)
          try:
              with urllib.request.build_opener(NoRedirect()).open(request, timeout=30) as response:
                  raw = response.read(1048577)
                  if response.status != 202 or len(raw) > 1048576:
                      raise ValueError("Invalid intake response")
                  result = json.loads(raw)
                  task_id = result.get("task_id", "")
                  if not re.fullmatch(r"issue-[a-f0-9]{32}", task_id) or result.get("status") not in ("queued", "running", "completed"):
                      raise ValueError("Invalid task acknowledgement")
          except urllib.error.HTTPError as error:
              message = "Task intake failed: HTTP " + str(error.code)
              if error.code in (400, 403, 409):
                try:
                  raw = error.read(1048577)
                  conflict = json.loads(raw) if len(raw) <= 1048576 else {}
                  reasons = {
                    400: {"repository-token-header-unsupported", "invalid-task-or-result"},
                    403: {"repository-not-authorized", "repository-mismatch", "task-authentication-unsupported",
                      "repository-credential-required", "repository-identity-mismatch",
                      "repository-read-access-unverified", "repository-issue-mismatch",
                      "repository-credential-denied", "repository-validation-unavailable"},
                    409: {"retry-already-created", "retry-requires-failed-task",
                          "retry-requires-lifecycle-sync", "issue-task-active"},
                  }[error.code]
                  if isinstance(conflict, dict):
                    reason = conflict.get("error")
                    if isinstance(reason, str) and reason in reasons:
                      message += ": " + reason
                    elif error.code == 409 and conflict.get("status") == "failed" and conflict.get("replayed") is True:
                      message += ": failed-task-replay"
                    conflict_task = conflict.get("task_id")
                    if error.code == 409 and isinstance(conflict_task, str) and re.fullmatch(r"issue-[a-f0-9]{32}", conflict_task):
                      message += " task_id=" + conflict_task
                except (OSError, ValueError, TypeError):
                  pass
              raise SystemExit(message) from None
          except (OSError, ValueError, TypeError, AttributeError):
              raise SystemExit("Task intake failed; check transport, access and gateway task state") from None
          print("Task accepted: " + task_id)
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as step_summary:
                  step_summary.write("Task accepted: " + task_id + "\n")
