# ---------------------------------------------------------------------------
# Secrets referenced by the worker stack (coder agents).
# ---------------------------------------------------------------------------
#
# The coder workers in `orchestrator/workers.yaml` read `orchestrator-secrets`
# from the `orchestrator` namespace. That secret lives in
# `monitoring/secrets.yaml` for the orchestrator stack; the worker stack reuses
# the same secret name so the supervisor and workers share one key.
#
# Create it with:
#
#   kubectl create secret generic orchestrator-secrets \
#     --namespace orchestrator \
#     --from-literal=openai-api-key=<the-openai-key>
#
# See monitoring/secrets.yaml for the idrac-credentials secret.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: orchestrator-secrets
  namespace: orchestrator
  labels:
    app: orchestrator
type: Opaque
stringData:
  openai-api-key: ""
