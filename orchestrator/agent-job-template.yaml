# ---------------------------------------------------------------------------
# Rendered Job template.
#
# orchestrator/supervisor-task-acceptor.py renders THIS file at spawn time by
# replacing the placeholders below with the task's values, then runs
# `kubectl apply -f -`. It becomes orchestrator/agent-job.yaml after render.
#
#   ${TASK_ID}   -> "<repo>#<issue_number>"
#   ${ISSUE_URL} -> issue HTML URL
#   ${REPO}      -> "owner/name"
#   ${GITHUB_TOKEN} -> the workflow-scoped PAT (from the acceptor)
#
# The four args are injected directly; the env below reads them from
# metadata.annotations so the Job self-documents its provenance.
# ---------------------------------------------------------------------------
apiVersion: batch/v1
kind: Job
metadata:
  name: orchestrator-agent
  namespace: orchestrator
  labels:
    app: orchestrator
    component: agent
spec:
  # One-shot: the supervisor creates exactly one Job per task. Do NOT retry —
  # the LangGraph loop is internally bounded (max-iterations) and the
  # supervisor handles re-planning on failure. A stuck Job is a bug to fix,
  # not a transient to back off from.
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: orchestrator
        component: agent
      # Provenance annotations set by the supervisor at spawn time (from the
      # task payload). They let anyone `kubectl get job orchestrator-agent -o
      # yaml` see which issue drove this run.
      annotations:
        orchestrator.io/task-id: "${TASK_ID}"
        orchestrator.io/issue-url: "${ISSUE_URL}"
        orchestrator.io/repo: "${REPO}"
        orchestrator.io/gh-token: "set-by-supervisor"
    spec:
      restartPolicy: Never
      containers:
        - name: orchestrator-agent
          image: "${IMAGE}"
          imagePullPolicy: IfNotPresent
          # The drain mode consumes a single task (issue) to completion and
          # then exits — the supervisor re-uses the same long-running process
          # for the next task (no cold start per issue).
          command: ["/bin/sh", "-c"]
          args:
            - exec
            - python3
            - -m
            - langgraph.cli
            - serve
            - --mode
            - drain
            - --task-id
            - "${TASK_ID:-}"
            - --issue-url
            - "${ISSUE_URL:-}"
            - --judge-url
            - "${JUDGE_URL:-https://llm.local/v1}"
            - --judge-model
            - "${JUDGE_MODEL:-qwen2.5-coder-7b-instruct-q5-kn@64k}"
            - --openai-key
            - "${OPENAI_API_KEY:-}"
            - --work-dir
            - "${TASK_WORK_DIR:-/data/task-work}"
            - --repo
            - "${REPO:-}"
            - --gh-token
            - "${GITHUB_TOKEN:-}"
          # Pure CPU. The node budget is ~10 cores for the agent fleet; this
          # Job is the one always-on worker of the drain pass. Cap it so a long
          # loop cannot starve the supervisor / judge.
          resources:
            requests:
              cpu: 1
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 6Gi
          env:
            # Secrets — never hardcoded. OPENAI_API_KEY for the judge, the
            # workflow-scoped GITHUB_TOKEN for the PR (injected by the
            # supervisor from the task payload).
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: orchestrator-secrets
                  key: openai-api-key
            # Networking — judge brain lives on the llama.cpp server (no GPU).
            - name: JUDGE_HOST
              value: "llm-server-gpu1"
            - name: JUDGE_PORT
              value: "8000"
            # Loop tuning (policy knobs — see orchestrator/workers.yaml).
            - name: MAX_ITERATIONS
              valueFrom:
                configMapKeyRef:
                  name: orchestrator-config
                  key: max-iterations
            - name: TASK_WAIT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: orchestrator-config
                  key: task-wait-seconds
            - name: LOOP_STATE_DIR
              valueFrom:
                configMapKeyRef:
                  name: orchestrator-config
                  key: loop-state-dir
            # Per-task identity (rendered by the acceptor from the payload).
            - name: TASK_ID
              value: "${TASK_ID}"
            - name: ISSUE_URL
              value: "${ISSUE_URL}"
            - name: REPO
              value: "${REPO}"
            - name: GITHUB_TOKEN
              value: "${GITHUB_TOKEN}"
          volumeMounts:
            - name: task-work
              mountPath: /data/task-work
            - name: loop-state
              mountPath: /data/loop-state
              mountPropagation: None
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "pgrep -f langgraph >/dev/null 2>&1 || exit 1"
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: task-work
          emptyDir: {}
        - name: loop-state
          persistentVolumeClaim:
            claimName: loop-state-pvc
      # Per-task annotations are set by the supervisor's spawn endpoint (see
      # the template metadata.annotations above). They carry the
      # workflow-scoped token + issue identity into the Job metadata; the Job
      # reads them via metadata.annotations (above).
