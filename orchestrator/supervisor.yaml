# ---------------------------------------------------------------------------
# The LangGraph orchestrator runtime (supervisor / judge).
# ---------------------------------------------------------------------------
# Always-on, CPU-only Deployment. This is the overnight supervisor runtime:
#   - holds the LangGraph state machine (the agent loop),
#   - runs the supervisor/judge tool-calling agent, and
#   - spawns coder worker pods on demand.
#
# It is a long-running server, NOT a batch job: it sits idle and listening,
# wakes for a task, runs the loop, opens a PR, then idles again.
#
# Image / runtime selection (Open Question O8) is parameterized below so the
# manifest does not hard-code a specific LangGraph runtime image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: orchestrator
  labels:
    app: orchestrator
    component: supervisor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
        component: supervisor
    spec:
      containers:
        - name: orchestrator
          image: "${IMAGE:-ghcr.io/autonomous/langgraph-orchestrator:latest}"
          # Pull latest so the supervisor loop / tool-calling code stays current
          # after an autonomous build cycle; the tag can be pinned if desired.
          imagePullPolicy: IfNotPresent
          # The supervisor runs the LangGraph loop (the long-running part) and
          # hosts a lightweight HTTP sidecar that accepts tasks. The two share
          # this pod but are independent: the loop stays resident and waiting;
          # the sidecar re-binds the port on each task (see
          # orchestrator/supervisor-task-acceptor.py).
          command: ["/bin/sh", "-c"]
          args:
            - sh -c 'mkdir -p /data/loop-state; python3 -m langgraph.cli serve --state-dir /data/loop-state --task-wait-seconds "${TASK_WAIT:-30}" --max-iterations "${MAX_ITERATIONS:-8}" --judge-url "${JUDGE_URL:-https://llm.local/v1}" --judge-model "${JUDGE_MODEL:-qwen2.5-<judge>@64k}" --openai-key "${OPENAI_API_KEY:-}" & echo $! > /var/run/langgraph.pid; exec python3 orchestrator/supervisor-task-acceptor.py --port 8000'

          # CPU/RAM limits fit the node budget (orchestrator ~2-3 cores, 4-6 GiB).
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2.5"
              memory: 5Gi
          env:
            # Secrets are injected as env vars / a mounted secret — never
            # hardcoded in the manifest. See the README for how to rotate.
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: orchestrator-secrets
                  key: openai-api-key
            # Networking — the supervisor calls the judge brain over the
            # network (no GPU needed here). Swap the host when connecting
            # through a different ingress / VPN.
            - name: JUDGE_HOST
              value: "llm-server-gpu1"
            - name: JUDGE_PORT
              value: "8000"
            # Loop tuning (Open Questions O4 / O5). Parameterized so policy can
            # change without editing the Deployment spec.
            - name: MAX_ITERATIONS
              valueFrom:
                configMapKeyRef:
                  name: orchestrator-config
                  key: max-iterations
            - name: TASK_WAIT
              valueFrom:
                configMapKeyRef:
                  name: orchestrator-config
                  key: task-wait-seconds
            - name: JUDGE_URL
              valueFrom:
                configMapKeyRef:
                  name: orchestrator-config
                  key: judge-url
            - name: JUDGE_MODEL
              valueFrom:
                configMapKeyRef:
                  name: orchestrator-config
                  key: judge-model
            # Persistence mount for the loop state (see below).
            - name: LOOP_STATE_DIR
              valueFrom:
                configMapKeyRef:
                  name: orchestrator-config
                  key: loop-state-dir
            # The path to the Job template the acceptor renders per task. It
            # ships in the supervisor image (which also contains the
            # acceptor); baked into the build so there is a single source of
            # truth and no ConfigMap duplication.
            - name: AGENT_JOB_TEMPLATE
              value: "/opt/orchestrator/agent-job-template.yaml"
            # Secrets
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: orchestrator-secrets
                  key: openai-api-key
            # The workflow-scoped PAT authenticates the /api/v1/tasks/spawn
            # endpoint and is baked into every Job the supervisor renders.
            - name: ACCEPTOR_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: orchestrator-secrets
                  key: github-token
            # Image reference for agent Jobs (overridable at deploy time).
            - name: IMAGE
              value: "${IMAGE:-ghcr.io/autonomous/langgraph-orchestrator:latest}"
          volumeMounts:
            - name: loop-state
              mountPath: /data/loop-state
              # Persistent so a node restart resumes the loop where it stopped
              # instead of re-planning from scratch (design requirement §6.2).
              mountPropagation: None
            # Local file holding the Job template (ships in the image).
            - name: agent-job-template
              mountPath: /opt/orchestrator
              readOnly: true
          # Readiness = the task-acceptor HTTP server is up on :8000 (the
          # Service routes here). An HTTP GET is the right check because the
          # loop process is deliberately idle most of the time and an exec
          # probe would always succeed even when the acceptor is not listening.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Liveness = the loop runtime is resident (not just the HTTP sidecar).
          # If the loop dies, restart the whole container so both come back.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "pgrep -f langgraph >/dev/null 2>&1 || exit 1"
            initialDelaySeconds: 60
            periodSeconds: 30
      # Pure CPU workload — no GPU requested or limited. The coder/judge models
      # live on the llama.cpp servers in the `llm` namespace.
      restartPolicy: Always

---
# ClusterIP Service so the supervisor can be addressed by the worker-spawn
# mechanism (and by tool-calling glue that needs to reach it by name).
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: orchestrator
  labels:
    app: orchestrator
    component: supervisor
spec:
  selector:
    app: orchestrator
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
