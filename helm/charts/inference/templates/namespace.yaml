{{- if not (lookup "v1" "Namespace" "" (.Release.Namespace | default .Values.namespace)) }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace | default .Values.namespace | quote }}
  labels:
    app.k8s.io/name: {{ .Chart.Name | quote }}
    app.k8s.io/instance: {{ .Release.Name | default "k8s-inference" | quote }}
    app.k8s.io/version: {{ .Chart.AppVersion | quote }}
{{- end }}
