{{/*
Supervisor Deployment for the orchestrator workload (LangGraph loop).
*/}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-orchestrator
  namespace: {{ .Values.namespace }}
  labels:
    app: orchestrator
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      containers:
        - name: supervisor
          image: {{ .Values.orchestrator.image | default "ghcr.io/utopiklab/code-factory-supervisor:latest" }}
          command:
            - python3
            - -m
            - langgraph
            - cli
            - serve
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Chart.Name }}-orchestrator-secrets
                  key: openai-api-key
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Chart.Name }}-orchestrator-secrets
                  key: github-token
            - name: ALLOWED_REPO
              value: {{ (index .Values.orchestrator.config "repo") | default "." | quote }}
            - name: ORCHESTRATOR_CONFIG
              valueFrom:
                configMapKeyRef:
                  name: {{ .Chart.Name }}-orchestrator-config
                  key: orchestrator-config
          resources:
            requests:
              cpu: {{ .Values.orchestrator.config.cpuRequest | default "500m" }}
              memory: {{ .Values.orchestrator.config.memory | default "2Gi" }}
            limits:
              cpu: {{ .Values.orchestrator.config.cpuLimit | default "2500m" }}
              memoryLimit: {{ .Values.orchestrator.config.memoryLimit | default "5Gi" }}
      imagePullSecrets:
        - name: ghcr-secret
