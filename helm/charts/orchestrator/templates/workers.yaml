{{/*
Workers: ConfigMap orchestrator-config + Job coder-workers.
Faithful to orchestrator/workers.yaml (ConfigMap + Job coder-workers).
*/}}
{{- $m := dict
  "max-iterations" (int (default (index .Values.orchestrator.config "max-iterations") 8))
  "task-wait-seconds" (int (default (index .Values.orchestrator.config "task-wait-seconds") 30))
  "loop-state-dir" (default (index .Values.orchestrator.config "loop-state-dir") "/data/loop-state")
  "judge-url" (default (index .Values.orchestrator.config "judge-url") "https://inference.local/v1")
  "judge-model" (default (index .Values.orchestrator.config "judge-model") "qwen2.5-coder-7b-instruct-q4-km@32k")
  "worker-roles" (index .Values.workers "worker-roles")
-}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-orchestrator-config
  namespace: {{ .Values.namespace }}
  labels:
    app: orchestrator
    app.kubernetes.io/managed-by: Helm
  annotations:
    created-by: helm
data:
  orchestrator-config: |-
{{ toJson $m | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Chart.Name }}-coder-workers
  namespace: {{ .Values.namespace }}
  labels:
    app: orchestrator
    component: worker
    app.kubernetes.io/managed-by: Helm
spec:
  # 2 parallel coder workers, each allowed up to 8 completions (max).
  parallelism: 2
  max: 8
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: orchestrator
        component: worker
    spec:
      restartPolicy: Never
      containers:
        - name: coder
          image: {{ .Values.orchestrator.image | default "ghcr.io/utopiklab/code-factory-worker:latest" }}
          command:
            - python3
            - -m
            - worker
          env:
            - name: TASK_ID
              value: {{ (index .Values.orchestrator.config "task-id") | default "orchestrator-task" | quote }}
            - name: ISSUE_URL
              value: {{ (index .Values.orchestrator.config "issue-url") | default "" | quote }}
            - name: REPO
              value: {{ (index .Values.orchestrator.config "repo") | default "." | quote }}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Chart.Name }}-orchestrator-secrets
                  key: github-token
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Chart.Name }}-orchestrator-secrets
                  key: openai-api-key
          envFrom:
            - configMapRef:
                name: {{ .Chart.Name }}-orchestrator-config
          volumeMounts:
            - name: workspace
              mountPath: /data/work
            - name: loop-state
              mountPath: /data/loop-state
          resources:
            requests:
              cpu: {{ .Values.orchestrator.config.cpuRequest | default "500m" }}
              memory: {{ .Values.orchestrator.config.memory | default "2Gi" }}
            limits:
              cpu: {{ .Values.orchestrator.config.cpuLimit | default "2500m" }}
              memoryLimit: {{ .Values.orchestrator.config.memoryLimit | default "5Gi" }}
      volumes:
        - name: workspace
          emptyDir: {}
        - name: loop-state
          emptyDir: {}
      imagePullSecrets:
        - name: ghcr-secret
