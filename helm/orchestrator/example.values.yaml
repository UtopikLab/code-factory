# Orchestrator-only nonsecret overrides. Copy to orchestrator/local.values.yaml.
# Replace illustrative identity/policy values; external Secret references live
# in ../local.secrets-values.yaml and are applied last by deploy.sh.
githubAuth:
  audience: https://gateway.example.com/tasks
  appId: "12"
  workflowPolicy:
    ref: refs/heads/main
    workflow: .github/workflows/drain.yaml
    events: [ issues, workflow_dispatch ]
  repositories: []

gateway:
  transportMode: edge-tls
  ingress:
    tlsTermination: external
    host: code-factory.local
    tlsSecretName: ""

supervisor:
  config:
    acceptor-url: https://gateway.example.com

management:
  enabled: false
  github:
    clientId: ""
    clientSecret:
      name: ""
      key: client-secret
  authMode: admin
  oidc:
    issuer: ""
    audience: ""
    jwksUrl: ""
    allowedSubjects: []
  publicOrigin: https://management.example.com
  ingress:
    enabled: false
    host: management.example.com
    tlsTermination: external
    tlsSecretName: ""
