# Single orchestrator override example. Secret refs are names only; provision
# their data with the encrypted bundle workflow.
githubAuth:
  audience: https://gateway.example.com/tasks
  appId: "12"
  workflowPolicy:
    ref: refs/heads/main
    workflow: .github/workflows/drain.yaml
    events: [ issues, workflow_dispatch ]
  repositories: []

imagePullSecrets:
- name: code-factory-ghcr-pull

gateway:
  transportMode: edge-tls
  ingress:
    tlsTermination: external
    host: code-factory.local
    tlsSecretName: ""

supervisor:
  config:
    acceptor-url: https://gateway.example.com

management:
  enabled: false
  github:
    clientId: ""
  authMode: admin
  oidc:
    issuer: ""
    audience: ""
    jwksUrl: ""
    allowedSubjects: []
  publicOrigin: https://management.example.com
  ingress:
    enabled: false
    host: management.example.com
    tlsTermination: external
    tlsSecretName: ""
