{{/*
Worker: ConfigMap orchestrator-config + Job coder-worker.
Faithful to orchestrator/worker.yaml (ConfigMap + Job coder-worker).
*/}}
{{- $m := dict
  "max-iterations" (int (default (index .Values.orchestrator.config "max-iterations") 8))
  "task-wait-seconds" (int (default (index .Values.orchestrator.config "task-wait-seconds") 30))
  "loop-state-dir" (default (index .Values.orchestrator.config "loop-state-dir") "/data/loop-state")
  "acceptor-url" (default (index .Values.orchestrator.config "acceptor-url") (printf "http://%s-orchestrator-gateway.%s.svc.cluster.local:8000" .Chart.Name .Values.namespace))
  "acceptor-url" (default (index .Values.orchestrator.config "acceptor-url") (printf "http://%s-orchestrator-gateway.%s.svc.cluster.local:8000" .Chart.Name .Values.namespace))
  "judge-url" (default (index .Values.orchestrator.config "judge-url") "https://inference.local/v1")
  "judge-model" (default (index .Values.orchestrator.config "judge-model") "qwen2.5-coder-7b-instruct-q4-km@32k")
  "worker-roles" (index .Values.workers "worker-roles")
-}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-config
  namespace: {{ .Values.namespace }}
  labels:
    app: orchestrator
    app.kubernetes.io/managed-by: Helm
  annotations:
    created-by: helm
data:
  {{- range $k, $v := $m }}
  {{ $k }}: {{ $v | quote }}
  {{ end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Chart.Name }}-worker
  namespace: {{ .Values.namespace }}
  labels:
    app: orchestrator
    component: worker
    app.kubernetes.io/managed-by: Helm
spec:
  # 2 parallel coder workers, each allowed up to 8 completions (max).
  parallelism: 2
  max: 8
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: orchestrator
        component: worker
    spec:
      restartPolicy: Never
      containers:
        - name: coder
          image: {{ .Values.orchestrator.image | default "ghcr.io/utopiklab/code-factory-worker:latest" }}
          imagePullPolicy: Always
          volumeMounts:
            - name: workspace
              mountPath: /data/work
            - name: loop-state
              mountPath: /data/loop-state
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Chart.Name }}-secrets
                  key: github-token
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Chart.Name }}-secrets
                  key: openai-api-key
            - name: ACCEPTOR_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Chart.Name }}-config
                  key: acceptor-url
          resources:
            requests:
              cpu: {{ .Values.orchestrator.config.cpuRequest | default "500m" }}
              memory: {{ .Values.orchestrator.config.memory | default "2Gi" }}
            limits:
              cpu: {{ .Values.orchestrator.config.cpuLimit | default "2500m" }}
              memory: {{ .Values.orchestrator.config.memoryLimit | default "5Gi" }}
      volumes:
        - name: workspace
          emptyDir: {}
        - name: loop-state
          emptyDir: {}
      imagePullSecrets:
        - name: ghcr-secret
