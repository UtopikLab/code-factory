{{/*
Worker: ConfigMap orchestrator-config + Job coder-worker.
Faithful to orchestrator/worker.yaml (ConfigMap + Job coder-worker).
*/}}
{{- $m := dict
  "max-iterations" (int (default (index .Values.supervisor.config "max-iterations") 8))
  "task-wait-seconds" (int (default (index .Values.supervisor.config "task-wait-seconds") 30))
  "loop-state-dir" (default (index .Values.supervisor.config "loop-state-dir") "/data/loop-state")
  "acceptor-url" (default (index .Values.supervisor.config "acceptor-url") (printf "http://%s-orchestrator-gateway.%s.svc.cluster.local:8000" .Chart.Name .Values.namespace))
  "judge-url" (default (index .Values.supervisor.config "judge-url") "https://inference.local/v1")
  "judge-model" (default (index .Values.supervisor.config "judge-model") "qwen2.5-coder-7b-instruct-q4-km@32k")
  "worker-roles" (index .Values.worker "worker-roles")
-}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-config
  namespace: {{ .Values.namespace }}
  labels:
    app: orchestrator
    app.kubernetes.io/managed-by: Helm
  annotations:
    created-by: helm
data:
  {{- range $k, $v := $m }}
  {{ $k }}: {{ $v | quote }}
  {{ end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Chart.Name }}-worker
  namespace: {{ .Values.namespace }}
  labels:
    app: orchestrator
    component: worker
    app.kubernetes.io/managed-by: Helm
spec:
  # 2 parallel coder workers, each allowed up to 8 completions.
  parallelism: 2
  completions: 8
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: orchestrator
        component: worker
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1001
        runAsNonRoot: true
        fsGroup: 1001
      containers:
        - name: coder
          image: {{ .Values.worker.image | default "ghcr.io/utopiklab/code-factory-worker:latest" }}
          imagePullPolicy: Always
          volumeMounts:
            - name: workspace
              mountPath: /data/task-work
            - name: loop-state
              mountPath: /data/loop-state
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Chart.Name }}-secrets
                  key: github-token
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Chart.Name }}-secrets
                  key: openai-api-key
            - name: ACCEPTOR_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Chart.Name }}-config
                  key: acceptor-url
            - name: JUDGE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Chart.Name }}-config
                  key: judge-url
            - name: JUDGE_MODEL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Chart.Name }}-config
                  key: judge-model
            - name: ALLOWED_REPOS
              value: {{ default .Values.supervisor.config.repo .Values.gateway.config.repo | quote }}
            - name: CODER_URL
              value: {{ default (default "https://inference.local/v1" (index .Values.supervisor.config "judge-url")) .Values.worker.coderUrl | quote }}
            - name: CODER_MODEL
              value: {{ index .Values.worker "worker-model" | quote }}
            - name: JUDGE_ACCEPT_THRESHOLD
              value: {{ .Values.worker.judgeAcceptThreshold | quote }}
            - name: TASK_REPO_POLICIES
              value: {{ .Values.worker.repoPolicies | toJson | quote }}
          resources:
            requests:
              cpu: {{ .Values.supervisor.config.cpuRequest | default "500m" }}
              memory: {{ .Values.supervisor.config.memory | default "2Gi" }}
            limits:
              cpu: {{ .Values.supervisor.config.cpuLimit | default "2500m" }}
              memory: {{ .Values.supervisor.config.memoryLimit | default "5Gi" }}
          ports:
            - name: metrics
              containerPort: 9000
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: 512Mi
        - name: loop-state
          emptyDir: {}
      imagePullSecrets:
        - name: ghcr-secret
