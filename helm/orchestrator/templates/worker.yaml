{{/*
Worker: ConfigMap orchestrator-config + Job coder-worker.
Faithful to orchestrator/worker.yaml (ConfigMap + Job coder-worker).
*/}}
{{- $judgeUrl := default "http://llama-server-args-gpu1.inference.svc.cluster.local:8000/v1" (index .Values.supervisor.config "judge-url") -}}
{{- $coderUrl := default (default "http://llama-server-args-gpu0.inference.svc.cluster.local:8000/v1" (index .Values.supervisor.config "judge-url")) .Values.worker.coderUrl -}}
{{- $coderNative := eq $coderUrl "http://llama-server-args-gpu0.inference.svc.cluster.local:8000/v1" -}}
{{- $judgeNative := eq $judgeUrl "http://llama-server-args-gpu1.inference.svc.cluster.local:8000/v1" -}}
{{- if kindIs "bool" .Values.worker.coderNativeDownload -}}
{{- $coderNative = .Values.worker.coderNativeDownload -}}
{{- end -}}
{{- if kindIs "bool" .Values.worker.judgeNativeDownload -}}
{{- $judgeNative = .Values.worker.judgeNativeDownload -}}
{{- end -}}
{{- $m := dict
  "max-iterations" (int (default (index .Values.supervisor.config "max-iterations") 8))
  "task-wait-seconds" (int (default (index .Values.supervisor.config "task-wait-seconds") 30))
  "loop-state-dir" (default (index .Values.supervisor.config "loop-state-dir") "/data/loop-state")
  "acceptor-url" (required "supervisor.config.acceptor-url must be a trusted HTTPS gateway origin" (index .Values.supervisor.config "acceptor-url"))
  "judge-url" $judgeUrl
  "judge-model" (default "Qwen/Qwen2.5-Coder-7B-Instruct-GGUF:Q4_K_M" (index .Values.supervisor.config "judge-model"))
  "worker-roles" (index .Values.worker "worker-roles")
-}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-config
  namespace: {{ .Values.namespace }}
  labels:
    app: orchestrator
    app.kubernetes.io/managed-by: Helm
  annotations:
    created-by: helm
data:
  {{- range $k, $v := $m }}
  {{ $k }}: {{ $v | quote }}
  {{ end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Chart.Name }}-worker
  namespace: {{ .Values.namespace }}
  labels:
    app: orchestrator
    component: worker
    app.kubernetes.io/managed-by: Helm
spec:
  suspend: true
  # 2 parallel coder workers, each allowed up to 8 completions.
  parallelism: 2
  completions: 8
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: orchestrator
        component: worker
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1001
        runAsNonRoot: true
        fsGroup: 1001
      containers:
        - name: coder
          image: {{ .Values.worker.image | default "ghcr.io/utopiklab/code-factory-worker:latest" }}
          imagePullPolicy: Always
          volumeMounts:
            - name: workspace
              mountPath: /data/task-work
            - name: loop-state
              mountPath: /data/loop-state
          env:
            - name: CODEFACTORY_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-gateway-auth" .Chart.Name) .Values.gateway.auth.existingSecret }}
                  key: gateway-auth-token
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Chart.Name }}-secrets
                  key: openai-api-key
            - name: ACCEPTOR_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Chart.Name }}-config
                  key: acceptor-url
            - name: JUDGE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Chart.Name }}-config
                  key: judge-url
            - name: JUDGE_MODEL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Chart.Name }}-config
                  key: judge-model
            - name: ALLOWED_REPOS
              value: {{ default .Values.supervisor.config.repo .Values.gateway.config.repo | quote }}
            - name: CODER_URL
              value: {{ $coderUrl | quote }}
            - name: CODER_MODEL
              value: {{ index .Values.worker "worker-model" | quote }}
            - name: CODER_NATIVE_DOWNLOAD
              value: {{ $coderNative | quote }}
            - name: JUDGE_NATIVE_DOWNLOAD
              value: {{ $judgeNative | quote }}
            - name: JUDGE_ACCEPT_THRESHOLD
              value: {{ .Values.worker.judgeAcceptThreshold | quote }}
            - name: TASK_REPO_POLICIES
              value: {{ .Values.worker.repoPolicies | toJson | quote }}
          resources:
            requests:
              cpu: {{ .Values.supervisor.config.cpuRequest | default "500m" }}
              memory: {{ .Values.supervisor.config.memory | default "2Gi" }}
            limits:
              cpu: {{ .Values.supervisor.config.cpuLimit | default "2500m" }}
              memory: {{ .Values.supervisor.config.memoryLimit | default "5Gi" }}
          ports:
            - name: metrics
              containerPort: 9000
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: 512Mi
        - name: loop-state
          emptyDir: {}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
