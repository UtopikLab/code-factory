{{/*
Secrets for the orchestrator workload (env secretKeyRef).
*/}}
{{- if (.Values.githubAuth.privateKeyPem | default "" | trim) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orchestrator.githubAppSecretName" . | quote }}
  namespace: {{ .Values.namespace }}
type: Opaque
data:
  {{ .Values.githubAuth.privateKeySecret.key | quote }}: {{ .Values.githubAuth.privateKeyPem | b64enc | quote }}
---
{{- end }}
{{- if .Values.management.enabled }}
{{- if and (eq .Values.management.authMode "admin") (not .Values.management.admin.passwordSecret.name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Chart.Name }}-management-admin
  namespace: {{ .Values.namespace }}
type: Opaque
data:
  password: {{ required "Set management.admin.password in helm/local.secrets-values.yaml" .Values.management.admin.password | b64enc | quote }}
---
{{- end }}
{{- end }}
{{- if not .Values.credentials.models.openaiSecret.name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Chart.Name }}-openai-model-auth
  namespace: {{ .Values.namespace }}
type: Opaque
data:
  openai-api-key: {{ .Values.credentials.models.openaiApiKey | default "" | b64enc | quote }}
---
{{- end }}
{{- if not .Values.credentials.internal.supervisorServiceSecret.name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orchestrator.supervisorSecretName" . }}
  namespace: {{ .Values.namespace }}
type: Opaque
data:
  supervisor-auth-token: {{ required "Set credentials.internal.supervisorServiceToken in helm/local.secrets-values.yaml" .Values.credentials.internal.supervisorServiceToken | b64enc | quote }}
---
{{- end }}
{{- if not .Values.credentials.models.coderSecret.name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orchestrator.workerSecretName" . }}
  namespace: {{ .Values.namespace }}
type: Opaque
data:
  coder-api-key: {{ .Values.credentials.models.coderApiKey | default "" | b64enc | quote }}
{{- end }}
