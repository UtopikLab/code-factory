{{/*
Secrets for the orchestrator workload (env secretKeyRef).
Faithful to orchestrator/secrets.yaml (Secret orchestrator-secrets).
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Chart.Name }}-secrets
  namespace: {{ .Values.namespace }}
type: Opaque
data:
  openai-api-key: {{ .Values.orchestrator.openaiApiKey | default "" | b64enc }}
  github-token: {{ .Values.orchestrator.githubToken | default "" | b64enc }}
