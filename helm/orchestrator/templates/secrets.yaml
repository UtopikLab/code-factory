{{/*
Secrets for the orchestrator workload (env secretKeyRef).
*/}}
{{- if .Values.management.enabled }}
{{- if eq .Values.management.authMode "admin" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Chart.Name }}-management-admin
  namespace: {{ .Values.namespace }}
type: Opaque
data:
  password: {{ required "Set management.admin.password in helm/local.secrets-values.yaml" .Values.management.admin.password | b64enc | quote }}
---
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Chart.Name }}-openai-model-auth
  namespace: {{ .Values.namespace }}
type: Opaque
data:
  openai-api-key: {{ .Values.credentials.models.openaiApiKey | default "" | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orchestrator.supervisorSecretName" . }}
  namespace: {{ .Values.namespace }}
type: Opaque
data:
  supervisor-auth-token: {{ required "Set credentials.internal.supervisorServiceToken in helm/local.secrets-values.yaml" .Values.credentials.internal.supervisorServiceToken | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orchestrator.workerSecretName" . }}
  namespace: {{ .Values.namespace }}
type: Opaque
data:
  coder-api-key: {{ .Values.credentials.models.coderApiKey | default "" | b64enc | quote }}
