{{/*
Secrets for the orchestrator workload (env secretKeyRef).
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Chart.Name }}-openai-model-auth
  namespace: {{ .Values.namespace }}
type: Opaque
data:
  openai-api-key: {{ .Values.credentials.models.openaiApiKey | default "" | b64enc }}
{{- if .Values.supervisor.auth.createSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.supervisor.auth.existingSecret }}
  namespace: {{ .Values.namespace }}
type: Opaque
data:
  supervisor-auth-token: {{ required "credentials.internal.supervisorServiceToken is required when supervisor.auth.createSecret is true" .Values.credentials.internal.supervisorServiceToken | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.supervisor.auth.pullRequestSecret }}
  namespace: {{ .Values.namespace }}
type: Opaque
data:
  pr-github-token: {{ required "credentials.github.pullRequestPat is required when supervisor.auth.createSecret is true" .Values.credentials.github.pullRequestPat | b64enc }}
{{- end }}
{{- if not .Values.gateway.auth.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Chart.Name }}-gateway-auth
  namespace: {{ .Values.namespace }}
type: Opaque
data:
  gateway-auth-token: {{ required "credentials.internal.gatewayClientToken is required when gateway.auth.existingSecret is empty" .Values.credentials.internal.gatewayClientToken | b64enc }}
{{- end }}
{{- if .Values.worker.auth.createSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.worker.auth.existingSecret }}
  namespace: {{ .Values.namespace }}
type: Opaque
data:
  coder-api-key: {{ required "credentials.models.coderApiKey is required when worker.auth.createSecret is true" .Values.credentials.models.coderApiKey | b64enc }}
{{- end }}
