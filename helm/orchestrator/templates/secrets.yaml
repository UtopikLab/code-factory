{{/*
Secrets for the orchestrator workload (env secretKeyRef).
Faithful to orchestrator/secrets.yaml (Secret orchestrator-secrets).
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Chart.Name }}-secrets
  namespace: {{ .Values.namespace }}
type: Opaque
data:
  openai-api-key: {{ index .Values.supervisor.config "openai-api-key" | default "" | b64enc }}
{{- if not .Values.gateway.auth.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Chart.Name }}-gateway-auth
  namespace: {{ .Values.namespace }}
type: Opaque
data:
  gateway-auth-token: {{ required "gateway.auth.token or gateway.auth.existingSecret is required" .Values.gateway.auth.token | b64enc }}
{{- end }}
