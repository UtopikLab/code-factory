{{/*
Secrets for the orchestrator workload (env secretKeyRef).
Faithful to orchestrator/secrets.yaml (Secret orchestrator-secrets).
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Chart.Name }}-secrets
  namespace: {{ .Values.namespace }}
type: Opaque
data:
  openai-api-key: {{ index .Values.supervisor.config "openai-api-key" | default "" | b64enc }}
  github-token: {{ dig "orchestrator" "githubToken" "" .Values.AsMap | b64enc }}
