{{/*
Supervisor Deployment for the orchestrator workload (LangGraph loop).
*/}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-supervisor
  namespace: {{ .Values.namespace }}
  labels:
    app: orchestrator
    component: supervisor
    app.kubernetes.io/managed-by: Helm
  annotations:
    created-by: helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
      component: supervisor
  template:
    metadata:
      labels:
        app: orchestrator
        component: supervisor
    spec:
      containers:
        - name: supervisor
          image: {{ .Values.supervisor.image | default "ghcr.io/utopiklab/code-factory-supervisor:latest" }}
          imagePullPolicy: Always
          ports:
            - name: metrics
              containerPort: 9000
          resources:
            requests:
              cpu: {{ .Values.supervisor.config.cpuRequest | default "500m" }}
              memory: {{ .Values.supervisor.config.memory | default "2Gi" }}
            limits:
              cpu: {{ .Values.supervisor.config.cpuLimit | default "2500m" }}
              memory: {{ .Values.supervisor.config.memoryLimit | default "5Gi" }}
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Chart.Name }}-secrets
                  key: github-token
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Chart.Name }}-secrets
                  key: openai-api-key
            - name: ACCEPTOR_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Chart.Name }}-config
                  key: acceptor-url
            - name: JUDGE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Chart.Name }}-config
                  key: judge-url
            - name: JUDGE_MODEL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Chart.Name }}-config
                  key: judge-model
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: metrics
            periodSeconds: 15
      imagePullSecrets:
        - name: ghcr-secret
