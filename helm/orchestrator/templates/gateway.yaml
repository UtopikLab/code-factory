{{/*
Gateway Deployment + Service for the task-acceptor.
Faithful to the thinktank design: the task-acceptor is now its own
always-on Deployment, independent of the supervisor loop.
*/}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-gateway
  namespace: {{ .Values.namespace }}
  labels:
    app: orchestrator
    component: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
      component: gateway
  template:
    metadata:
      labels:
        app: orchestrator
        component: gateway
        app.kubernetes.io/managed-by: Helm
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: gateway
          image: {{ .Values.gateway.image | default "ghcr.io/utopiklab/code-factory-gateway:latest" }}
          imagePullPolicy: {{ .Values.gateway.imagePullPolicy | default "Always" }}
          ports:
            - name: gateway
              containerPort: 8000
            - name: metrics
              containerPort: 9000
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Chart.Name }}-secrets
                  key: github-token
            - name: ALLOWED_REPO
              value: {{ .Values.gateway.config.repo | quote }}
          resources:
            requests:
              cpu: {{ .Values.gateway.config.cpuRequest | default "100m" }}
              memory: {{ .Values.gateway.config.memory | default "256Mi" }}
            limits:
              cpu: {{ .Values.gateway.config.cpuLimit | default "250m" }}
              memory: {{ .Values.gateway.config.memoryLimit | default "512Mi" }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: gateway
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: gateway
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-orchestrator-gateway
  namespace: {{ .Values.namespace }}
  labels:
    app: orchestrator
    component: gateway
spec:
  selector:
    app: orchestrator
    component: gateway
  ports:
    - name: task-acceptor
      port: 8000
      targetPort: 8000
    - name: metrics
      port: 9000
      targetPort: 9000
