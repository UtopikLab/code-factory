{{- if .Values.registry.create }}
{{- if not (has (dict "name" "ghcr-secret") .Values.imagePullSecrets) }}
{{- fail "registry.create requires imagePullSecrets to include ghcr-secret" }}
{{- end }}
{{- $username := required "registry.username is required when registry.create is true" .Values.registry.username }}
{{- $token := required "registry.token is required when registry.create is true" .Values.registry.token }}
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-secret
  namespace: {{ .Values.namespace }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ dict "auths" (dict "ghcr.io" (dict "username" $username "password" $token "auth" (printf "%s:%s" $username $token | b64enc))) | toJson | b64enc | quote }}
{{- end }}