{{/*
Ingress for the orchestrator gateway (task-acceptor).

Exposes task intake and reporting through the TLS-only Traefik entrypoint.

Note: `orchestrator.local` must resolve (Traefik hosts entry or a DNS
record). For pure localhost testing you can temporarily change the host to
`localhost`.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Chart.Name }}-orchestrator-gateway-ingress
  namespace: {{ .Values.namespace }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/service.method: ANY
  labels:
    app: {{ .Chart.Name }}
    component: orchestrator-gateway
    app.kubernetes.io/component: task-acceptor
    app.k8s.io/managed-by: Helm
spec:
  tls:
    - hosts: [{{ .Values.gateway.ingress.host | quote }}]
      secretName: {{ .Values.gateway.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.gateway.ingress.host }}
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: {{ .Chart.Name }}-orchestrator-gateway
                port:
                  number: 8000
