# yaml-language-server: $schema=none
apiVersion: v2
name: k8s-inference
description: A single-node K3s (containerd) LLM inference stack for k8s-node01.
type: application
version: 0.1.0
appVersion: "0.1.0"
annotations:
  license: MIT
keywords:
- inference
- k8s
- llama.cpp
- gpu
sources:
- https://github.com/UtopikLab/code-factory
templates:
- helpers.tpl
dependencies:
- name: nvidia-device-plugin
  version: "0.20.1"
  repository: "https://nvidia.github.io/k8s-device-plugin"
  condition: nvidia-device-plugin.enabled
- name: inference
  version: "0.1.0"
  repository: "charts/inference"
  condition: inference.enabled
- name: orchestrator
  version: "0.1.0"
  repository: "charts/orchestrator"
  condition: orchestrator.enabled

maintainers:
- name: UtopikLab
  url: https://github.com/UtopikLab
