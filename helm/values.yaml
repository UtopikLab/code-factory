# ---------------------------------------------------------------------------
# values.yaml — global settings & image decisions for the k8s-inference chart.
# ---------------------------------------------------------------------------
#
# Image strategy:
#   * "real"      -> version verified against the official source (see NOTES.txt).
#   * "latest"    -> verified real but no stable tag; pin later.
#   * "PLACEHOLDER" -> could not be confirmed (auth-blocked private registry or
#                      a version not present in the public index). Override via
#                      the `IMAGE` value / `set --set` flag at deploy time.
#
# Set a default image for every workload via the `IMAGE` global. Example:
#   helm install k8s-inference . --set IMAGE=ghcr.io/you/langgraph-supervisor:latest

# Default image registry for containerd (K3s host). See inference/common.sh.
global:
  IMAGE_REGISTRY: "ghcr.io"
  # Registry credentials applied to all resources (set a Secret name, or empty to omit).
  imagePullSecrets: "nvidia-registry-creds"

# Default images for the two workloads, each configurable via `set --set IMAGE=...` / `WORKER_IMAGE=...`.
# Both globals are overridable at deploy time with the `set` flag:
#   helm install . --set IMAGE=... --set WORKER_IMAGE=...
IMAGE: "ghcr.io/utopiklab/code-factory-supervisor:latest"
WORKER_IMAGE: "ghcr.io/utopiklab/code-factory-worker:latest"

# ---------------------------------------------------------------------------
# Namespaces (created if not present).
# ---------------------------------------------------------------------------
namespaces:
  create: true
  inference:
    name: inference
    labels:
      app: inference-server
  orchestrator:
    name: orchestrator
    labels:
      app: orchestrator

# The NVIDIA device-plugin chart is a sub-chart, gated by this flag.
nvidia-device-plugin:
  enabled: true
  # The chart enforces a guard against the 'default' namespace; set true so the
  # chart renders when this parent chart is templated/installed in 'default'.
  allowDefaultNamespace: true
  # The sub-chart scopes its namespace-scoped resources (Namespace, DaemonSet,
  # ServiceAccount) to the parent release namespace via this field. Without it,
  # `helm template` renders them under 'default' and a live `helm install` would
  # place them in the wrong namespace (collision with the live gpu-namespace
  # device-plugin). Set to the live device-plugin namespace.
  # namespaceOverride: gpu

  # The orchestrator sub-chart (supervisor loop + task-acceptor gateway), gated by
  # this flag. The sub-chart scopes its namespace-scoped resources to the parent
  # release namespace so `helm template` renders them in the correct namespace.
orchestrator:
  enabled: true
  # namespaceOverride: orchestrator

  # ---------------------------------------------------------------------------
  # Inference servers (namespace: inference). llama.cpp image VERIFIED real.
  # ---------------------------------------------------------------------------
  # Inference sub-chart (llama.cpp inference servers, one per Tesla P40).
  # The inference values (image, imagePullPolicy, configMaps, gpuDeviceIds,
  # resources, ingress, pvc) were moved into charts/inference/values.yaml and
  # are now owned by the inference sub-chart. This parent global is unused.
  #
  gpuDeviceIds:
    gpu0: "0"
    gpu1: "1"
  # Resources: full P40 (23 GiB) requested to prevent oversubscription.
  resources:
    # CPU resource budget for the llama.cpp server pods.
    cpuRequest: "1"
    cpuLimit: "2"
    # The k8s-node01 host physically has 2× Tesla P40 GPUs, but Kubernetes
    # reports nvidia.com/gpu: 0 because the nvidia-device-plugin DaemonSet is not
    # running (its nodeAffinity requires NFD-detected feature labels that this
    # K3s node lacks). Once the device-plugin exposes the GPU resource, restore
    # "gpu: 1" to request a physical GPU per pod. For now the GPU request
    # stays 0 so the CPU-bound server pods can schedule.
    gpu: "0"
    memory: "2Gi"
  # Ingress (Traefik, shipped by K3s).
  ingress:
    host: inference.local
    path: /v1
    entrypoints: websecure
    middlewares: default@kubernetes/tcp-security
    method: ANY
  # Model weights PVC.
  pvc:
    name: inference-models
    storageClassName: k8s-sc-ssd-replicated
    accessMode: ReadWriteOnce
    size: 50Gi
    mountPath: /mnt/k8s-data-ssd
