# Private override applied last to both charts. Copy only if no local file exists.
# Keep App identity/policy and runtime settings in orchestrator/local.values.yaml.
# Keep Secret references here; provision their contents separately in the
# orchestrator namespace by default. Never put the management service token here.
githubAuth:
  # Replace the empty string with a YAML literal block (privateKeyPem: |) to
  # create privateKeySecret below. Missing/blank PEM uses the existing Secret.
  # PEM contents enter Helm values/release history; never commit real credentials.
  privateKeyPem: ""
  privateKeySecret:
    name: code-factory-github-app
    key: private-key.pem
  managementServiceSecret:
    name: code-factory-management-service
    key: token

# Internal tokens must be generated independently by the operator.
credentials:
  internal:
    # Separate from the management service token.
    supervisorServiceToken: "<independent-random-supervisor-service-token>"
  github:
    # Registry auth is independent of App auth. Required when registry.create
    # is true; otherwise configure existing imagePullSecrets in nonsecret values.
    ghcrReadPackagesPat: "<read-packages-only-pat>"
  models:
    openaiApiKey: ""
    coderApiKey: ""

management:
  admin:
    username: admin
    password: ""

# Optional migration: provision and verify these Secrets in the orchestrator
# namespace FIRST, then uncomment references and clear their raw fields above.
# These names are conventions, not a claim that the Secrets already exist.
# Do not reuse names of Secrets currently owned by the Helm release.
# credentials:
#   internal:
#     supervisorServiceToken: ""
#     supervisorServiceSecret:
#       name: code-factory-supervisor-service
#       key: token
#   models:
#     openaiApiKey: ""
#     coderApiKey: ""
#     openaiSecret:
#       name: code-factory-openai
#       key: api-key
#     coderSecret:
#       name: code-factory-coder
#       key: api-key
# management:
#   admin:
#     password: ""
#     passwordSecret:
#       name: code-factory-management-admin
#       key: password
# Merge into the mappings above; do not duplicate top-level YAML keys.
# GHCR already supports external imagePullSecrets. Before clearing its PAT,
# provision pull Secrets in BOTH namespaces, set registry.create: false and
# registry.username: "" in shared values, and select the verified pull Secret
# via inference.imagePullSecrets and orchestrator imagePullSecrets respectively.
