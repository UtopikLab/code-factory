# Repository auth uses GitHub App + Actions OIDC and external Secrets; configure githubAuth
# in helm/orchestrator/local.values.yaml, not under credentials below.
# See docs/operations/credential-separation.md for the nonsecret App example:
# githubAuth.privateKeySecret: name=code-factory-github-app, key=private-key.pem
# githubAuth.managementServiceSecret: name=code-factory-management-service, key=token
# Provision these Secrets separately in the orchestrator namespace; the service
# token is needed only when management is enabled. Never put the App PEM here.
# Internal tokens must be generated independently by the operator.
credentials:
  internal:
    # Separate from the management service token.
    supervisorServiceToken: "<independent-random-supervisor-service-token>"
  github:
    # Registry auth is independent of App auth. Required when registry.create
    # is true; otherwise configure existing imagePullSecrets in nonsecret values.
    ghcrReadPackagesPat: "<read-packages-only-pat>"
  models:
    openaiApiKey: ""
    coderApiKey: ""

management:
  admin:
    username: admin
    password: ""
  # Management human login, separate from GitHub Actions OIDC.
  oidc:
    issuer: ""
    audience: ""
    jwksUrl: ""
    allowedSubjects: []
