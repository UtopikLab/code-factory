# GitHub values below are provider-issued PATs with separate, least-privilege
# grants. Internal tokens must be generated independently by the operator.
credentials:
  internal:
    gatewayClientToken: "<independent-random-gateway-token-at-least-32-characters>"
    supervisorServiceToken: "<independent-random-supervisor-service-token>"
  github:
    ghcrReadPackagesPat: "<read-packages-only-pat>"
    pullRequestPat: "<repository-pr-operations-pat>"
  models:
    openaiApiKey: ""
    coderApiKey: ""

management:
  repositories:
    owner/repository: ""
  oidc:
    issuer: ""
    audience: ""
    jwksUrl: ""
    allowedSubjects: []
