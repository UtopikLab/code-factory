{{/*
Model weights PVC for the inference namespace.
Faithful to inference/deployment.yaml (PVC inference-models).
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.inference.pvc.name }}
  namespace: inference
  labels:
    app: {{ .Chart.Name }}
    component: {{ .Release.Name }}
    app.kubernetes.io/component: inference-models
    app.k8s.io/managed-by: Helm
spec:
  accessModes:
    - {{ .Values.inference.pvc.accessMode }}
  storageClassName: {{ .Values.inference.pvc.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.inference.pvc.size }}
