{{/*
Ingress for the inference namespace (Traefik, shipped by K3s).
Faithful to inference/deployment.yaml (Ingress inference-ingress).
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Chart.Name }}-inference-ingress
  namespace: inference
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: default@kubernetes/tcp-security
    traefik.ingress.kubernetes.io/rule.match: Host:`inference.local` && PathPrefix(`/v1`)
    traefik.ingress.kubernetes.io/service.method: ANY
  labels:
    app: {{ .Chart.Name }}
    component: {{ .Release.Name }}
    app.kubernetes.io/component: inference-server
    app.k8s.io/managed-by: Helm
spec:
  tls:
    - hosts:
        - inference.local
      # secretName: inference-tls-cert # Optional: Add this line if you have a specific SSL certificate secret
  rules:
    - host: inference.local
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: inference-server
                port:
                  number: 8000
