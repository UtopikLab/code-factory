{{/*
Service for the inference namespace.
Faithful to inference/deployment.yaml (Service inference-server port 8000).
*/}}
apiVersion: v1
kind: Service
metadata:
  name: inference-server
  namespace: inference
  labels:
    app: {{ .Chart.Name }}
    component: {{ .Release.Name }}
    app.kubernetes.io/component: inference-server
    app.k8s.io/managed-by: Helm
spec:
  selector:
    app: inference-server
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
{{- range $idx, $cfg := .Values.inference.configMaps }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $cfg.name }}
  namespace: {{ $.Values.namespace }}
spec:
  selector:
    app: inference-server
    gpu: {{ $idx | quote }}
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
{{- end }}
