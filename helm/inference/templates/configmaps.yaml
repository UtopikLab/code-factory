{{/*
Inference server args ConfigMaps (llama.cpp, one per GPU).
Two ConfigMaps: llama-server-args-gpu0 and llama-server-args-gpu1.
Each contains the server args for the respective GPU.
*/}}
{{- $inf := .Values.inference -}}
{{- $ns := .Release.Namespace | default "inference" -}}
{{- range $idx, $cfg := $inf.configMaps }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $cfg.name }}
  namespace: {{ $ns }}
  labels:
    app: {{ $.Chart.Name | quote }}
    component: {{ $cfg.name }}
    app.kubernetes.io/component: llama-server-args
    app.kubernetes.io/managed-by: Helm
data:
{{ range $k, $v := $cfg.model }}
  {{ $k }}: {{ $v | quote }}
{{ end }}
{{ end }}
