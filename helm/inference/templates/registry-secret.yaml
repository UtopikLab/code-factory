{{- if .Values.registry.create }}
{{- if not (has (dict "name" "ghcr-read-packages-pull-secret") .Values.inference.imagePullSecrets) }}
{{- fail "registry.create requires inference.imagePullSecrets to include ghcr-read-packages-pull-secret" }}
{{- end }}
{{- $username := required "registry.username is required when registry.create is true" .Values.registry.username }}
{{- $token := required "credentials.github.ghcrReadPackagesPat is required when registry.create is true" .Values.credentials.github.ghcrReadPackagesPat }}
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-read-packages-pull-secret
  namespace: {{ .Values.namespace }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ dict "auths" (dict "ghcr.io" (dict "username" $username "password" $token "auth" (printf "%s:%s" $username $token | b64enc))) | toJson | b64enc | quote }}
{{- end }}