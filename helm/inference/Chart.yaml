# yaml-language-server: $schema=none
apiVersion: v2
name: inference
description: >
  llama.cpp inference servers (one per Tesla P40), the OpenAI-compatible llama.cpp server with the per-GPU args ConfigMap mounted at /etc/llama-server-args and model weights from the shared PVC.
type: application
version: "0.1.0"
appVersion: "0.1.0"
annotations:
  license: MIT
keywords:
- inference
- k8s
- llama.cpp
- gpu
sources:
- https://github.com/UtopikLab/code-factory
dependencies:
- name: nvidia-device-plugin
  version: "0.20.1"
  repository: "https://nvidia.github.io/k8s-device-plugin"
  condition: nvidia-device-plugin.enabled
