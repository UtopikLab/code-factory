{{/*
Agent Job Template: orchestrator-agent. Rendered per replica in _workers.yaml.
Faithful to orchestrator/agent-job-template.yaml (placeholders ${TASK_ID}/${ISSUE_URL}/${REPO}/${GITHUB_TOKEN}).
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Chart.Name }}-orchestrator-agent
  namespace: orchestrator
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: orchestrator-agent
    spec:
      restartPolicy: Never
      containers:
        - name: agent
          image: {{ .Values.IMAGE | default "ghcr.io/utopiklab/langgraph-orchestrator:latest" }}
          env:
            - name: TASK_ID
              value: {{ (index .Values.orchestrator.config "task-id") | default "orchestrator-task" | quote }}
            - name: ISSUE_URL
              value: {{ (index .Values.orchestrator.config "issue-url") | default "" | quote }}
            - name: REPO
              value: {{ (index .Values.orchestrator.config "repo") | default "UtopikLab/llm-rig" | quote }}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "k8s-inference.name" (dict "context" . "component" "orchestrator-secrets" "kind" "Secret") }}
                  key: github-token
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "k8s-inference.name" (dict "context" . "component" "orchestrator-secrets" "kind" "Secret") }}
                  key: openai-api-key
            - name: ORCHESTRATOR_CONFIG
              valueFrom:
                configMapKeyRef:
                  name: {{ .Chart.Name }}-orchestrator-config
                  key: orchestrator-config
          envFrom:
            - configMapRef:
                name: {{ .Chart.Name }}-orchestrator-config
          volumeMounts:
            - name: loop-state
              mountPath: /data/loop-state
            - name: task-work
              mountPath: /data/task-work
          resources:
            requests:
              cpu: 500m
              memory: 3Gi
            limits:
              cpu: "6.5"
              memory: 7Gi
      volumes:
        - name: loop-state
          persistentVolumeClaim:
            claimName: orchestrator-loop-state
        - name: task-work
          emptyDir: {}
      imagePullSecrets:
        - name: ghcr-credentials
