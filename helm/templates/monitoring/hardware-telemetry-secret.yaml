{{/*
Hardware-telemetry credentials Secret for the monitoring namespace.
Faithful to monitoring/hardware-telemetry.yaml (envFrom.secretRef + volume secret).
*/}}
---
# ---------------------------------------------------------------------------
# hardware-telemetry credentials Secret (holds REDFISH_URL / PROMETHEUS_URL).
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Chart.Name }}-hardware-telemetry-credentials
  namespace: monitoring
  labels:
    app: hardware-telemetry
    component: hardware-telemetry
type: Opaque
data:
  redfish-url: {{ .Values.monitoring.hardwareTelemetry.prometheusUrl | default "http://truenas.utopiklab.lan:9090" | b64enc }}
  prometheus-url: {{ .Values.monitoring.hardwareTelemetry.prometheusUrl | default "http://truenas.utopiklab.lan:9090" | b64enc }}
