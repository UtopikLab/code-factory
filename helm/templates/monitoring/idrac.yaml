{{/*
Monitoring: iDRAC telemetry -> central Prometheus (IPMI).
Faithful to the k8s-node01 design: iDRAC9 Enterprise / IPMI v2.0.
*/}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-idrac-config
  namespace: monitoring
  labels:
    app: idrac-telemetry
data:
  transport: "ipmi"
  idrac-ip: {{ .Values.monitoring.iDrac.ip | default "192.168.1.100" | quote }}
  idrac-user: {{ .Values.monitoring.iDrac.user | default "Administrator" | quote }}
  prometheus-url: {{ .Values.monitoring.iDrac.prometheusUrl | default "http://truenas.utopiklab.lan:9090" | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-idrac-ipmi-config
  namespace: monitoring
  labels:
    app: idrac-telemetry
data:
  ipmi.yml: |
    modules:
      default:
        interfaces:
          - driver: "lanplus"
            address: "{{ .Values.monitoring.iDrac.ip | default "192.168.1.100" }}"
            username: "{{ .Values.monitoring.iDrac.user | default "Administrator" }}"
            password: "{{ .Values.monitoring.iDrac.password | default "REPLACE_ME" }}"
        collectors:
          - bmc
          - chassis
          - dcmi
          - fans
          - psu
          - sel
          - sensors
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Chart.Name }}-idrac-ipmi-exporter
  namespace: monitoring
  labels:
    app: idrac-telemetry
    transport: ipmi
spec:
  selector:
    matchLabels:
      name: idrac-ipmi-exporter
  template:
    metadata:
      labels:
        name: idrac-ipmi-exporter
    spec:
      hostNetwork: true
      hostPID: true
      hostIPC: true
      tolerations:
        - operator: Exists
      serviceAccountName: {{ .Chart.Name }}-idrac-ipmi-exporter
      containers:
        - name: ipmi-exporter
          image: {{ .Values.monitoring.idracExporter.image | default "quay.io/prometheuscommunity/ipmi-exporter:latest" }}
          imagePullPolicy: IfNotPresent
          args:
            - --web.listen-address=:9290
            - --config.file=/etc/ipmi-exporter/ipmi.yml
          env:
            - name: IPMI_IP
              valueFrom:
                configMapKeyRef:
                  name: {{ .Chart.Name }}-idrac-config
                  key: idrac-ip
            - name: IPMI_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ .Chart.Name }}-idrac-config
                  key: idrac-user
            - name: IPMI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Chart.Name }}-idrac-credentials
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 100Mi
            limits:
              cpu: 200m
              memory: 256Mi
          ports:
            - name: metrics
              containerPort: 9290
          volumeMounts:
            - name: ipmi-config
              mountPath: /etc/ipmi-exporter
              readOnly: true
      volumes:
        - name: ipmi-config
          configMap:
            name: {{ .Chart.Name }}-idrac-ipmi-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-idrac-ipmi-exporter
  namespace: monitoring
  labels:
    app: idrac-telemetry
spec:
  selector:
    name: idrac-ipmi-exporter
  ports:
    - name: metrics
      protocol: TCP
      port: 9290
      targetPort: 9290
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Chart.Name }}-idrac-ipmi-exporter
  namespace: monitoring
