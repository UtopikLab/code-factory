{{/*
Monitoring secrets: idrac-credentials.
Faithful to monitoring/idrac.yaml (Secret idrac-credentials, referenced via secretKeyRef).
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Chart.Name }}-idrac-credentials
  namespace: monitoring
type: Opaque
stringData:
  password: {{ .Values.monitoring.iDrac.password | default "REPLACE_ME" | quote }}
