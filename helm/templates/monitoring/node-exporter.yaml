{{/*
Monitoring: node-exporter DaemonSet + Service + SA.
Faithful to monitoring/node-exporter.yaml (DaemonSet + Service + SA).
*/}}
---
# ---------------------------------------------------------------------------
# node-exporter DaemonSet -> central Prometheus (TrueNAS).
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Chart.Name }}-node-exporter
  namespace: monitoring
  labels:
    app: node-exporter
spec:
  selector:
    matchLabels:
      name: node-exporter
  template:
    metadata:
      labels:
        name: node-exporter
    spec:
      hostNetwork: true
      hostPID: true
      hostIPC: true
      tolerations:
        - operator: Exists
      serviceAccountName: {{ .Chart.Name }}-node-exporter
      containers:
        - name: node-exporter
          image: {{ .Values.monitoring.nodeExporter.image | default "prom/node-exporter:v1.9.1" }}
          imagePullPolicy: IfNotPresent
          args:
            - --path.procfs=/host/proc/procfs
            - --path.sysfs=/host/sys/sysfs
            - --path.rootfs=/host/root/rootfs
          env:
            - name: PROMETHEUS_SCRAPE_PORT
              value: {{ .Values.monitoring.nodeExporter.scrapePort | default "9100" | quote }}
            - name: CENTRAL_PROMETHEUS_URL
              value: {{ .Values.monitoring.nodeExporter.prometheusUrl | default "http://truenas.utopiklab.lan:9090" | quote }}
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          resources:
            requests:
              cpu: 100m
              memory: 200Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            privileged: true
          ports:
            - name: metrics
              containerPort: 9100
              hostPort: 9100
          volumeMounts:
            - name: proc
              mountPath: /host/proc/procfs
              readOnly: true
            - name: sys
              mountPath: /host/sys/sysfs
              readOnly: true
            - name: root
              mountPath: /host/root/rootfs
              readOnly: true
      volumes:
        - name: proc
          hostPath:
            path: /proc
            type: Directory
        - name: sys
          hostPath:
            path: /sys
            type: Directory
        - name: root
          hostPath:
            path: /
            type: Directory
---
# Service for node-exporter.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-node-exporter
  namespace: monitoring
  labels:
    app: node-exporter
spec:
  selector:
    name: node-exporter
  ports:
    - name: metrics
      protocol: TCP
      port: 9100
      targetPort: 9100
---
# ServiceAccount for node-exporter.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Chart.Name }}-node-exporter
  namespace: monitoring
