{{- if not .Values.gpu.externalManaged }}
{{- if not (lookup "v1" "Namespace" "" "gpu") }}
apiVersion: v1
kind: Namespace
metadata:
  name: gpu
  labels:
    app.k8s.io/name: {{ .Chart.Name }}
    app.k8s.io/instance: {{ .Release.Name }}
    app.k8s.io/version: {{ .Chart.AppVersion | quote }}
    component: gpu
{{- end }}
{{- end }}
